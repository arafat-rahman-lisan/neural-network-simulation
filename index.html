<p><strong>Third</strong>, gradient descent requires knowing the <strong>gradient</strong> of the loss function — the vector containing the partial derivative of the loss with respect to each of the parameters.</p>
</div>
<div class="panel">
  <div class="panel-head"><h4>Gradient descent, one step at a time</h4><span class="hint">Watch the learning rate matter</span></div>
  <div id="l17plot"></div>
  <div id="l17ctl"></div>
  <div class="btnrow"><button class="btn" id="l17step">▶ One step</button><button class="btn" id="l17run">▶▶ Run 40 steps</button><button class="btn ghost" id="l17rst">Reset</button><span class="hint" id="l17msg"></span></div>
</div>
<div class="callout warn"><span class="lab">The problem this creates</span>
<p>In logistic regression, for each observation we could <b>directly compute</b> the derivative of the loss with respect to an individual w or b. But for a neural network with millions of parameters across many layers, it is much harder to see how to compute the partial derivative of some weight in <b>layer 1</b> when the loss is attached to some much later layer. How do we partial out the loss over all those intermediate layers?</p></div>
`,
init(){
  const loss=w=>0.55*Math.pow(w-1.1,2)+0.28*Math.sin(3.2*w)+0.7;
  const grad=w=>1.1*(w-1.1)+0.28*3.2*Math.cos(3.2*w);
  let w=-2.1, hist=[w], timer=null;
  $('#l17ctl').innerHTML=slider("learning rate η",0.01,1.2,.01,0.18);
  const W=560,H=210,x0=-3,x1=3.4;
  const draw=()=>{
    const ys=[];for(let i=0;i<=200;i++)ys.push(loss(x0+(x1-x0)*i/200));
    const y0=Math.min(...ys)-.2,y1=Math.max(...ys)+.2;
    const px=v=>(v-x0)/(x1-x0)*W, py=v=>H-(v-y0)/(y1-y0)*H;
    let s=`<div class="svgwrap"><svg viewBox="-16 -12 ${W+40} ${H+38}">
      <path d="${curve(loss,x0,x1,y0,y1,W,H)}" fill="none" stroke="var(--rule)" stroke-width="2.4"/>`;
    hist.slice(-40).forEach((v,i,a)=>{
      s+=`<circle cx="${px(v)}" cy="${py(loss(v))}" r="3" fill="var(--back)" opacity="${.15+.85*i/Math.max(1,a.length-1)}"/>`;});
    const g=grad(w);
    s+=`<line x1="${px(w-.55)}" y1="${py(loss(w)-g*.55)}" x2="${px(w+.55)}" y2="${py(loss(w)+g*.55)}" stroke="var(--fwd)" stroke-width="2"/>`;
    s+=`<circle cx="${px(w)}" cy="${py(loss(w))}" r="8" fill="var(--neuron)" stroke="#fff" stroke-width="2"/>`;
    s+=`<text class="lbl" x="${W}" y="${H+26}" text-anchor="end">parameter value w</text>
        <text class="lbl" x="0" y="-2">loss</text></svg></div>`;
    $('#l17plot').innerHTML=s;
    $('#l17msg').textContent=`w = ${fmt(w,3)} · loss = ${fmt(loss(w),4)} · gradient = ${fmt(g,3)}`;
  };
  const step=()=>{ const eta=readSliders($('#l17ctl'))[0]; w=clamp(w-eta*grad(w),-3,3.4); hist.push(w); draw(); };
  $('#l17step').onclick=step;
  $('#l17run').onclick=()=>{ if(timer)clearInterval(timer); let n=0; timer=setInterval(()=>{step(); if(++n>=40)clearInterval(timer);},70); };
  $('#l17rst').onclick=()=>{ if(timer)clearInterval(timer); w=-2.1; hist=[w]; draw(); };
  bindSliders($('#l17ctl'),draw); draw();
}});

/* ---------- 18 ---------- */
L({unit:"Backpropagation", title:"What backpropagation is for", slides:"Slides 42–43",
sub:"Assigning blame backwards through the layers.",
html:`
<div class="prose">
<p>The answer to that question is the algorithm called <strong>error backpropagation</strong>, or backward differentiation.</p>
<p>The goal of backpropagation is to optimize the weights so that the network can learn how to correctly map arbitrary inputs to outputs.</p>
<p>The most basic method of training a network is <strong>trial and error</strong>: if the network is not behaving the way it should, change the weighting of a random link by a random amount; if accuracy declines, undo the change and make a different one. It takes time, but the trial and error method does produce results.</p>
</div>
<div class="panel">
  <div class="panel-head"><h4>Random search vs. following the gradient</h4><span class="hint">Same budget of attempts</span></div>
  <div id="l18race"></div>
  <div class="btnrow"><button class="btn" id="l18go">▶ Race them</button><span class="hint" id="l18msg">Both start at the same error</span></div>
</div>
<div class="callout"><span class="lab">Why backprop wins</span>
<p>Trial and error asks "did that help?" <b>after</b> the fact — one bit of information per attempt. Backprop uses the chain rule to compute, in a single backward sweep, <b>the exact direction and size of the change that helps for every weight at once</b>. Same amount of arithmetic, vastly more information.</p></div>
`,
init(){
  const W=560,H=180;
  let running=false;
  const draw=(a,b,n)=>{
    const maxN=60, y0=0, y1=0.35;
    const px=i=>i/maxN*W, py=v=>H-clamp(v,y0,y1)/(y1-y0)*H;
    const path=(arr,c)=>arr.map((v,i)=>(i?'L':'M')+px(i)+' '+py(v)).join(' ');
    $('#l18race').innerHTML=`<div class="svgwrap"><svg viewBox="-34 -14 ${W+60} ${H+40}">
      <line class="axis" x1="0" y1="${H}" x2="${W}" y2="${H}"/>
      <line class="axis" x1="0" y1="0" x2="0" y2="${H}"/>
      <path d="${path(a,'')}" fill="none" stroke="var(--back)" stroke-width="2.2"/>
      <path d="${path(b,'')}" fill="none" stroke="var(--fwd)" stroke-width="2.2"/>
      <text class="lbl" x="${W}" y="${H+26}" text-anchor="end">attempts</text>
      <text class="lbl" x="-8" y="10" text-anchor="end">error</text>
      <text style="font-size:11px;fill:var(--back)" x="${px(a.length-1)+6}" y="${py(a[a.length-1])+4}">trial &amp; error</text>
      <text style="font-size:11px;fill:var(--fwd)" x="${px(b.length-1)+6}" y="${py(b[b.length-1])+4}">backprop</text>
      </svg></div>`;
  };
  const run=()=>{
    if(running)return; running=true;
    let ra=[0.3], rb=[0.3], i=0;
    const t=setInterval(()=>{
      const last=ra[ra.length-1];
      const trial=last+(Math.random()-0.5)*0.06;
      ra.push(Math.min(last, Math.max(0.02,trial)));
      rb.push(Math.max(0.004, rb[rb.length-1]*0.9 - 0.0008));
      draw(ra,rb,i);
      $('#l18msg').textContent=`attempt ${i+1} — trial & error: ${fmt(ra[ra.length-1],4)} · backprop: ${fmt(rb[rb.length-1],4)}`;
      if(++i>=60){clearInterval(t);running=false;}
    },45);
  };
  draw([0.3],[0.3],0);
  $('#l18go').onclick=run;
}});

L({unit:"Backpropagation", title:"Forward pass, with real numbers", slides:"Slides 44–48",
sub:"The 2-2-2 network everyone learns backprop on.",
html:`
<div class="prose">
<p>The worked example uses a small network with <strong>two inputs, two hidden neurons, two output neurons, and two biases</strong>. Inputs are <span class="inline">i₁ = 0.05, i₂ = 0.10</span> and the targets are <span class="inline">0.01</span> and <span class="inline">0.99</span>. Every neuron uses the sigmoid.</p>
</div>
<div class="panel">
  <div class="panel-head"><h4>The network</h4><span class="hint">Advance the pass step by step</span></div>
  <div id="l19net"></div>
  <div class="btnrow"><button class="btn" id="l19step">▶ Next step</button><button class="btn ghost" id="l19rst">Reset</button></div>
  <div id="l19work" style="margin-top:14px"></div>
</div>
<div class="callout"><span class="lab">Total error</span>
<p>Using squared error, E<sub>total</sub> = Σ ½(target − output)². The two halves are <b>0.274811083</b> for o₁ and <b>0.023560026</b> for o₂, giving <b>E<sub>total</sub> = 0.298371109</b>. That number is the thing backprop is about to shrink.</p></div>
`,
init(){
  const P={i1:.05,i2:.10,w1:.15,w2:.20,w3:.25,w4:.30,b1:.35,w5:.40,w6:.45,w7:.50,w8:.55,b2:.60,t1:.01,t2:.99};
  const neth1=P.w1*P.i1+P.w2*P.i2+P.b1, outh1=sig(neth1);
  const neth2=P.w3*P.i1+P.w4*P.i2+P.b1, outh2=sig(neth2);
  const neto1=P.w5*outh1+P.w6*outh2+P.b2, outo1=sig(neto1);
  const neto2=P.w7*outh1+P.w8*outh2+P.b2, outo2=sig(neto2);
  const e1=0.5*Math.pow(P.t1-outo1,2), e2=0.5*Math.pow(P.t2-outo2,2);
  const steps=[
    {t:"Nothing computed yet. The network holds its initial weights.",rows:[]},
    {t:"Node h₁ — weighted sum, then sigmoid.",rows:[
      ["net<sub>h1</sub>","w₁·i₁ + w₂·i₂ + b₁·1 = 0.15×0.05 + 0.20×0.10 + 0.35×1",fmt(neth1,4)],
      ["out<sub>h1</sub>","1 / (1 + e^−0.3775)",fmt(outh1,6)]]},
    {t:"Node h₂ — same recipe, different weights.",rows:[
      ["net<sub>h2</sub>","w₃·i₁ + w₄·i₂ + b₁·1 = 0.25×0.05 + 0.30×0.10 + 0.35×1",fmt(neth2,4)],
      ["out<sub>h2</sub>","1 / (1 + e^−0.3925)",fmt(outh2,6)]]},
    {t:"Node o₁ — the hidden outputs are now the inputs.",rows:[
      ["net<sub>o1</sub>","w₅·out<sub>h1</sub> + w₆·out<sub>h2</sub> + b₂·1",fmt(neto1,6)],
      ["out<sub>o1</sub>","1 / (1 + e^−1.105906)",fmt(outo1,6)]]},
    {t:"Node o₂.",rows:[
      ["net<sub>o2</sub>","w₇·out<sub>h1</sub> + w₈·out<sub>h2</sub> + b₂·1",fmt(neto2,6)],
      ["out<sub>o2</sub>","1 / (1 + e^−1.224921)",fmt(outo2,6)]]},
    {t:"Total error. Targets were 0.01 and 0.99 — we are a long way off.",rows:[
      ["E<sub>o1</sub>","½(0.01 − "+fmt(outo1,6)+")²",fmt(e1,9)],
      ["E<sub>o2</sub>","½(0.99 − "+fmt(outo2,6)+")²",fmt(e2,9)],
      ["<b>E<sub>total</sub></b>","E<sub>o1</sub> + E<sub>o2</sub>","<b>"+fmt(e1+e2,9)+"</b>"]]}
  ];
  let s=0;
  const drawNet=()=>{
    const W=580,H=230;
    const N={i1:[58,72],i2:[58,158],h1:[240,72],h2:[240,158],o1:[430,72],o2:[430,158]};
    const vals={i1:P.i1,i2:P.i2,h1:outh1,h2:outh2,o1:outo1,o2:outo2};
    const lit={i1:s>=1,i2:s>=1,h1:s>=1,h2:s>=2,o1:s>=3,o2:s>=4};
    const colr={i1:'#9DBF9E',i2:'#9DBF9E',h1:'#7FA8D9',h2:'#7FA8D9',o1:'#7FA8D9',o2:'#7FA8D9'};
    const edge=(a,b,lab,live,dy)=>{
      const A=N[a],B=N[b];
      return `<line x1="${A[0]+22}" y1="${A[1]}" x2="${B[0]-22}" y2="${B[1]}" stroke="${live?'var(--fwd)':'var(--rule)'}" stroke-width="${live?2:1.2}"/>
       <text x="${(A[0]+B[0])/2}" y="${(A[1]+B[1])/2+dy}" text-anchor="middle" style="font-size:10px;fill:${live?'var(--fwd)':'var(--muted)'}">${lab}</text>`;};
    const node=(k,lab)=>`<ellipse cx="${N[k][0]}" cy="${N[k][1]}" rx="24" ry="18"
      fill="${lit[k]?colr[k]:'#fff'}" stroke="var(--ink)" stroke-width="1.4"/>
      <text x="${N[k][0]}" y="${N[k][1]+4}" text-anchor="middle" style="font-weight:700;font-size:11px">${lab}</text>
      ${lit[k]?`<text x="${N[k][0]}" y="${N[k][1]-26}" text-anchor="middle" style="font-size:10px;fill:var(--fwd);font-weight:700">${fmt(vals[k],6)}</text>`:''}`;
    $('#l19net').innerHTML=`<div class="svgwrap"><svg viewBox="0 0 ${W} ${H+34}">
      ${edge('i1','h1','w₁ .15',s>=1,-6)}${edge('i1','h2','w₂ .20',s>=2,-6)}
      ${edge('i2','h1','w₃ .25',s>=1,16)}${edge('i2','h2','w₄ .30',s>=2,16)}
      ${edge('h1','o1','w₅ .40',s>=3,-6)}${edge('h1','o2','w₆ .45',s>=4,-6)}
      ${edge('h2','o1','w₇ .50',s>=3,16)}${edge('h2','o2','w₈ .55',s>=4,16)}
      ${node('i1','i1')}${node('i2','i2')}${node('h1','h1')}${node('h2','h2')}${node('o1','o1')}${node('o2','o2')}
      <circle cx="90" cy="212" r="12" fill="#E6E6E6" stroke="var(--rule)"/><text x="90" y="216" text-anchor="middle" style="font-size:10px">1</text>
      <text x="112" y="216" style="font-size:10px;fill:var(--bias)">b₁ .35</text>
      <circle cx="270" cy="212" r="12" fill="#E6E6E6" stroke="var(--rule)"/><text x="270" y="216" text-anchor="middle" style="font-size:10px">1</text>
      <text x="292" y="216" style="font-size:10px;fill:var(--bias)">b₂ .60</text>
      <text x="${N.i1[0]-34}" y="${N.i1[1]+4}" text-anchor="end" style="font-size:10px;fill:var(--muted)">.05</text>
      <text x="${N.i2[0]-34}" y="${N.i2[1]+4}" text-anchor="end" style="font-size:10px;fill:var(--muted)">.10</text>
      <text x="${N.o1[0]+34}" y="${N.o1[1]+4}" style="font-size:10px;fill:var(--muted)">target .01</text>
      <text x="${N.o2[0]+34}" y="${N.o2[1]+4}" style="font-size:10px;fill:var(--muted)">target .99</text>
      </svg></div>`;
  };
  const draw=()=>{
    drawNet();
    const st=steps[s];
    $('#l19work').innerHTML=`<p style="font-family:var(--sans);font-size:13px;color:var(--ink-2);margin:0 0 10px">${st.t}</p>
      ${st.rows.length?`<table class="tbl"><tr><th>quantity</th><th style="text-align:left">arithmetic</th><th>value</th></tr>
      ${st.rows.map(r=>`<tr><td class="mono">${r[0]}</td><td style="text-align:left;font-size:11px">${r[1]}</td><td style="color:var(--fwd)">${r[2]}</td></tr>`).join('')}</table>`:''}`;
    $('#l19step').disabled = s>=steps.length-1;
  };
  $('#l19step').onclick=()=>{s++;draw();};
  $('#l19rst').onclick=()=>{s=0;draw();};
  draw();
}});

L({unit:"Backpropagation", title:"Backward pass: updating w₅", slides:"Slides 49–54",
sub:"The chain rule, split into three honest pieces.",
html:`
<div class="prose">
<p>Now we propagate backwards. We want to reduce the error by changing the weights, so consider <strong>w₅</strong>: what is the rate of change of the total error with respect to a change in w₅?</p>
<p>We cannot compute that directly, so the chain rule splits it into three factors we <em>can</em> compute:</p>
</div>
<div class="eq">∂E<sub>total</sub>/∂<span class="hl-w">w₅</span> = (∂E<sub>total</sub>/∂out<sub>o1</sub>) × (∂out<sub>o1</sub>/∂net<sub>o1</sub>) × (∂net<sub>o1</sub>/∂<span class="hl-w">w₅</span>)
<small>error → output · output → net input · net input → weight</small></div>
<div class="panel">
  <div class="panel-head"><h4>The three factors</h4><span class="hint">Reveal them one at a time</span></div>
  <div id="l20chain"></div>
  <div class="btnrow"><button class="btn" id="l20step">▶ Next factor</button><button class="btn ghost" id="l20rst">Reset</button></div>
</div>
<div class="panel">
  <div class="panel-head"><h4>Apply the update rule</h4><span class="hint">Drag η and watch the new weight</span></div>
  <div id="l20ctl"></div>
  <div id="l20upd"></div>
</div>
<div class="callout"><span class="lab">All four output weights</span>
<p>Repeating the same three-factor recipe gives <b>w₅⁺ = 0.35891648</b>, <b>w₆⁺ = 0.408666186</b>, <b>w₇⁺ = 0.511301270</b>, <b>w₈⁺ = 0.561370121</b>, with η = 0.5.</p></div>
`,
init(){
  const outo1=0.75136507, outh1=0.593269992, t1=0.01, w5=0.40;
  const f1=-(t1-outo1), f2=outo1*(1-outo1), f3=outh1, g=f1*f2*f3;
  const parts=[
    {n:"∂E<sub>total</sub> / ∂out<sub>o1</sub>", d:"= −(target − out<sub>o1</sub>) = −(0.01 − 0.75136507)", v:f1,
     why:"How much does the total error change if the output changes? The derivative of ½(t−out)² is just −(t−out)."},
    {n:"∂out<sub>o1</sub> / ∂net<sub>o1</sub>", d:"= out<sub>o1</sub>(1 − out<sub>o1</sub>) = 0.75136507 × 0.24863493", v:f2,
     why:"How much does the output change if the net input changes? This is the derivative of the sigmoid — and note it is small, which is the vanishing gradient story in miniature."},
    {n:"∂net<sub>o1</sub> / ∂w₅", d:"= out<sub>h1</sub> = 0.593269992", v:f3,
     why:"How much does the net input change if w₅ changes? Since net = w₅·out_h1 + w₆·out_h2 + b₂, the answer is simply out_h1."}
  ];
  let s=0;
  const draw=()=>{
    $('#l20chain').innerHTML=parts.map((p,i)=>`
      <div style="opacity:${i<s?1:.28};transition:opacity .35s;padding:12px 0;border-bottom:1px solid var(--rule-soft)">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap">
          <span class="mono" style="font-size:13px;font-weight:600">${p.n}</span>
          <span class="mono" style="font-size:15px;font-weight:700;color:var(--back)">${i<s?fmt(p.v,9):'?'}</span></div>
        <div class="mono" style="font-size:11px;color:var(--muted);margin-top:3px">${p.d}</div>
        ${i<s?`<p style="font-family:var(--sans);font-size:12.5px;color:var(--ink-2);margin:8px 0 0">${p.why}</p>`:''}
      </div>`).join('')+
      `<div style="opacity:${s>=3?1:.28};transition:opacity .35s;padding:14px 0 0;text-align:center">
        <div class="lbl" style="font-family:var(--sans);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)">gradient ∂E<sub>total</sub>/∂w₅</div>
        <div class="mono" style="font-size:28px;font-weight:700;color:var(--back)">${s>=3?fmt(g,9):'—'}</div>
        <div class="mono" style="font-size:11px;color:var(--muted);margin-top:4px">${fmt(f1,6)} × ${fmt(f2,6)} × ${fmt(f3,6)}</div></div>`;
    $('#l20step').disabled=s>=3;
  };
  $('#l20step').onclick=()=>{s++;draw();};
  $('#l20rst').onclick=()=>{s=0;draw();};
  draw();

  $('#l20ctl').innerHTML=slider("learning rate η",0.05,1.5,.05,0.5);
  const upd=()=>{
    const eta=readSliders($('#l20ctl'))[0];
    const nw=w5-eta*g;
    $('#l20upd').innerHTML=`<div class="eq" style="margin-bottom:8px">
      w₅⁺ = w₅ − η · ∂E<sub>total</sub>/∂w₅ = 0.40 − ${fmt(eta,2)} × ${fmt(g,9)} = <b style="color:var(--fwd)">${fmt(nw,8)}</b></div>
      <p style="font-family:var(--sans);font-size:12.5px;color:var(--muted);margin:0">
      The gradient is <b>positive</b>, meaning raising w₅ would raise the error — so we move w₅ <b>down</b>. With the lecture's η = 0.5 the answer is <b class="mono">0.35891648</b>.</p>`;
  };
  bindSliders($('#l20ctl'),upd); upd();
}});

L({unit:"Backpropagation", title:"Backward pass: reaching the hidden weights", slides:"Slides 57–61",
sub:"Where backprop earns its name.",
html:`
<div class="prose">
<p>Next we continue the backwards pass to calculate new values for <strong>w₁, w₂, w₃ and w₄</strong>. There is a twist here: out<sub>h1</sub> feeds into <strong>both</strong> o₁ and o₂, so its error contribution must be collected from both output neurons.</p>
</div>
<div class="eq">∂E<sub>total</sub>/∂out<sub>h1</sub> = ∂E<sub>o1</sub>/∂out<sub>h1</sub> + ∂E<sub>o2</sub>/∂out<sub>h1</sub>
<small>and each of those unpacks again: ∂E<sub>o1</sub>/∂out<sub>h1</sub> = (∂E<sub>o1</sub>/∂net<sub>o1</sub>) × (∂net<sub>o1</sub>/∂out<sub>h1</sub>), where ∂net<sub>o1</sub>/∂out<sub>h1</sub> = w₅</small></div>
<div class="panel">
  <div class="panel-head"><h4>Error flowing back into h₁</h4><span class="hint">Two paths, summed</span></div>

</div>
<div class="panel">

    <tr><th>quantity</th><th style="text-align:left">meaning</th><th>value</th></tr>
    <tr><td class="mono">∂E<sub>o1</sub>/∂net<sub>o1</sub></td><td style="text-align:left">0.74136507 × 0.186815602</td><td>0.138498562</td></tr>
    <tr><td class="mono">∂net<sub>o1</sub>/∂out<sub>h1</sub></td><td style="text-align:left">= w₅</td><td>0.40</td></tr>
    <tr><td class="mono">∂E<sub>o1</sub>/∂out<sub>h1</sub></td><td style="text-align:left">product of the two above</td><td>0.055399425</td></tr>
    <tr><td class="mono">∂E<sub>o2</sub>/∂out<sub>h1</sub></td><td style="text-align:left">same recipe via o₂</td><td>−0.019049119</td></tr>
    <tr><td class="mono"><b>∂E<sub>total</sub>/∂out<sub>h1</sub></b></td><td style="text-align:left">the two paths summed</td><td><b>0.036350306</b></td></tr>
    <tr><td class="mono">∂out<sub>h1</sub>/∂net<sub>h1</sub></td><td style="text-align:left">sigmoid derivative at h₁</td><td>0.241300709</td></tr>
    <tr><td class="mono">∂net<sub>h1</sub>/∂w₁</td><td style="text-align:left">= i₁</td><td>0.05</td></tr>
    <tr><td class="mono"><b>∂E<sub>total</sub>/∂w₁</b></td><td style="text-align:left">all three multiplied</td><td style="color:var(--back)"><b>0.000438568</b></td></tr>
    <tr><td class="mono"><b>w₁⁺</b></td><td style="text-align:left">0.15 − 0.5 × 0.000438568</td><td style="color:var(--fwd)"><b>0.149780716</b></td></tr>
  </table>
</div>
<div class="callout"><span class="lab">Look at the size of that number</span>
<p>The gradient for w₁ is <b>0.00044</b> — nearly 200× smaller than the gradient for w₅ (0.082). One layer further from the loss and the signal has already shrunk dramatically. That is the vanishing gradient problem showing up in a network with a single hidden layer. Now imagine fifty.</p></div>
`,
init(){
  const W=520,H=190;
  const N={h1:[110,95],o1:[380,50],o2:[380,145]};
  $('#l21viz').innerHTML=`<div class="svgwrap"><svg viewBox="0 0 ${W} ${H+28}">
    <defs><marker id="ah" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">

    <text x="255" y="56" text-anchor="middle" style="font-size:11px;fill:var(--back);font-weight:600">+0.055399</text>

}});

/* ---------- 22 ---------- */
L({unit:"Backpropagation", title:"Run the training loop", slides:"Slides 55–56, 62–63",
sub:"Forward, backward, update — ten thousand times.",
html:`
<div class="prose">
<p>Once every weight has been updated we <strong>propagate forward again</strong> and calculate the output. Again we calculate the error. If the error is minimal we stop; otherwise we propagate backwards and update the weights again. This process keeps repeating until the error becomes minimal.</p>
<p>When we fed forward 0.05 and 0.1 originally the error was <strong>0.298371109</strong>. After one full round of backpropagation the total error is down to <strong>0.291027924</strong>. It might not seem like much — but after repeating the process <strong>10,000 times</strong> the error plummets to <strong>0.0000351085</strong>, and the two output neurons generate <strong>0.015912196</strong> (target 0.01) and <strong>0.984065734</strong> (target 0.99).</p>
</div>
<div class="panel">
  <div class="panel-head"><h4>Live training — this network is really running in your browser</h4><span class="live">simulation</span></div>
  <div id="l22ctl"></div>
  <div class="btnrow" style="margin:10px 0 16px">
    <button class="btn" id="l22one">▶ 1 epoch</button>
    <button class="btn" id="l22h">▶▶ 100 epochs</button>
    <button class="btn" id="l22k">▶▶▶ Train to 10,000</button>
    <button class="btn ghost" id="l22rst">Reset to slide values</button>
  </div>
  <div id="l22stats"></div>
  <div id="l22chart" style="margin-top:16px"></div>
  <div id="l22tbl" style="margin-top:16px"></div>
</div>
<div class="callout"><span class="lab">You have now seen the whole loop</span>
<p>Units → activations → layers → matrix form → softmax → loss → gradients → backprop → repeat. Every model in the rest of the course, including the Transformer, is this same loop with a different arrangement of the middle.</p></div>
`,
init(){
  const I=[.05,.10], T=[.01,.99];
  let w,epoch,hist,timer=null;
  const reset=()=>{ w={w1:.15,w2:.20,w3:.25,w4:.30,b1:.35,w5:.40,w6:.45,w7:.50,w8:.55,b2:.60};
    epoch=0; hist=[]; if(timer){clearInterval(timer);timer=null;} };
  const fwd=()=>{
    const nh1=w.w1*I[0]+w.w2*I[1]+w.b1, oh1=sig(nh1);
    const nh2=w.w3*I[0]+w.w4*I[1]+w.b1, oh2=sig(nh2);
    const no1=w.w5*oh1+w.w6*oh2+w.b2, oo1=sig(no1);
    const no2=w.w7*oh1+w.w8*oh2+w.b2, oo2=sig(no2);
    const E=0.5*Math.pow(T[0]-oo1,2)+0.5*Math.pow(T[1]-oo2,2);
    return {oh1,oh2,oo1,oo2,E};
  };
  const train=(eta)=>{
    const s=fwd();
    const d1=-(T[0]-s.oo1)*s.oo1*(1-s.oo1);
    const d2=-(T[1]-s.oo2)*s.oo2*(1-s.oo2);
    const gw5=d1*s.oh1, gw6=d1*s.oh2, gw7=d2*s.oh1, gw8=d2*s.oh2;
    const dh1=(d1*w.w5+d2*w.w7)*s.oh1*(1-s.oh1);
    const dh2=(d1*w.w6+d2*w.w8)*s.oh2*(1-s.oh2);
    const gw1=dh1*I[0], gw2=dh1*I[1], gw3=dh2*I[0], gw4=dh2*I[1];
    /* biases held fixed, exactly as in the lecture's worked example */
    w.w5-=eta*gw5; w.w6-=eta*gw6; w.w7-=eta*gw7; w.w8-=eta*gw8;
    w.w1-=eta*gw1; w.w2-=eta*gw2; w.w3-=eta*gw3; w.w4-=eta*gw4;
    epoch++;
    if(epoch<=60||epoch%25===0) hist.push([epoch,s.E]);
    if(hist.length>500) hist=hist.filter((_,i)=>i%2===0);
  };
  $('#l22ctl').innerHTML=slider("learning rate η",0.05,2,.05,0.5);
  const render=()=>{
    const s=fwd();
    $('#l22stats').innerHTML=`<div class="grid3">
      ${[["epoch",epoch,"var(--ink)"],["total error",s.E<0.0001?s.E.toExponential(3):fmt(s.E,7),s.E<0.01?'var(--fwd)':'var(--back)'],
         ["outputs",fmt(s.oo1,6)+" / "+fmt(s.oo2,6),"var(--ink)"]]
        .map(([k,v,c])=>`<div style="text-align:center">
          <div class="lbl" style="font-family:var(--sans);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)">${k}</div>
          <div class="mono" style="font-size:${String(v).length>14?14:22}px;font-weight:700;color:${c};margin-top:2px">${v}</div></div>`).join('')}
      </div>
      <p style="font-family:var(--sans);font-size:12px;color:var(--muted);text-align:center;margin:10px 0 0">targets are 0.01 and 0.99 · the two biases are held fixed, as in the worked example</p>`;
    /* chart */
    const W=560,H=170;
    if(hist.length>1){
      const maxE=Math.max(...hist.map(h=>h[1])), maxEp=hist[hist.length-1][0];
      const px=e=>Math.log10(e+1)/Math.log10(maxEp+1)*W, py=v=>H-clamp(v/maxE,0,1)*H;
      const d=hist.map((h,i)=>(i?'L':'M')+px(h[0]).toFixed(1)+' '+py(h[1]).toFixed(1)).join(' ');
      $('#l22chart').innerHTML=`<div class="svgwrap"><svg viewBox="-38 -14 ${W+56} ${H+42}">
        <line class="axis" x1="0" y1="${H}" x2="${W}" y2="${H}"/><line class="axis" x1="0" y1="0" x2="0" y2="${H}"/>
        <path d="${d}" fill="none" stroke="var(--back)" stroke-width="2.2"/>
        <text class="lbl" x="-8" y="8" text-anchor="end">${fmt(maxE,4)}</text>
        <text class="lbl" x="-8" y="${H+4}" text-anchor="end">0</text>
        <text class="lbl" x="${W}" y="${H+26}" text-anchor="end">epochs (log scale) → ${maxEp}</text>
        <text class="lbl" x="0" y="-2">total error</text></svg></div>`;
    } else $('#l22chart').innerHTML='';
    const init={w1:.15,w2:.20,w3:.25,w4:.30,w5:.40,w6:.45,w7:.50,w8:.55};
    $('#l22tbl').innerHTML=`<table class="tbl"><tr><th>weight</th><th>start</th><th>now</th><th>moved</th></tr>
      ${Object.keys(init).map(k=>{const dlt=w[k]-init[k];
        return `<tr><td>${k}</td><td style="color:var(--muted)">${fmt(init[k],3)}</td><td>${fmt(w[k],6)}</td>
        <td class="${dlt>=0?'chg-up':'chg-dn'}">${dlt>=0?'+':''}${fmt(dlt,4)}</td></tr>`;}).join('')}</table>`;
  };
  const loop=(target)=>{
    if(timer)clearInterval(timer);
    const eta=readSliders($('#l22ctl'))[0];
    timer=setInterval(()=>{
      for(let i=0;i<Math.max(1,Math.floor((target-epoch)/40));i++){ if(epoch>=target)break; train(eta); }
      if(epoch<target) train(eta);
      render();
      if(epoch>=target){clearInterval(timer);timer=null;}
    },16);
  };
  $('#l22one').onclick=()=>{train(readSliders($('#l22ctl'))[0]);render();};
  $('#l22h').onclick=()=>loop(epoch+100);
  $('#l22k').onclick=()=>loop(10000);
  $('#l22rst').onclick=()=>{reset();render();};
  reset(); render();
}});

L({unit:"Review", title:"Check yourself", slides:"Whole lecture",
sub:"Ten questions covering everything above.",
html:`
<div class="prose">
<p>Answer before you reveal. If a question stings, the lesson it came from is named underneath — go back to it.</p>
</div>
<div id="l23quiz"></div>
<div class="panel" id="l23score" style="text-align:center"></div>
`,
init(){
  const Q=[
    {q:"What are the only two arithmetic operations inside a single unit, before activation?",
     a:"Multiply each input by its weight, then add everything up together with the bias. z = w·x + b.", from:"The unit: a weighted sum"},
    {q:"Why can't we build a deep network out of purely linear units?",
     a:"A stack of linear layers composes into a single linear layer. Depth adds no expressive power without a non-linearity between layers.", from:"Activation: adding the bend"},
    {q:"Why is tanh usually preferred over sigmoid for hidden layers?",
     a:"It is zero-centred, ranging −1 to +1, and smoothly differentiable, which makes optimisation better behaved. Sigmoid is still right when you want an output read as a probability.", from:"tanh and ReLU"},
    {q:"State the vanishing gradient problem in one sentence.",
     a:"Backprop multiplies one local derivative per layer; sigmoid and tanh derivatives are well below 1 in the saturated regions, so after many layers the product is near zero and early layers stop learning.", from:"The vanishing gradient problem"},
    {q:"Why exactly can a perceptron not compute XOR?",
     a:"A perceptron is a linear classifier — its decision boundary is a single straight line. XOR's two positive cases sit on one diagonal and its two negative cases on the other, so no line separates them. XOR is not linearly separable.", from:"The perceptron cannot do XOR"},
    {q:"What does the hidden layer do to the XOR inputs that makes the problem solvable?",
     a:"It builds a new representation. In hidden space the points [0,1] and [1,0] collapse onto the same location, and the positive and negative cases become linearly separable.", from:"Two layers of ReLU solve XOR"},
    {q:"Give the three-step computation of a hidden layer, and the shape of W.",
     a:"Multiply W by x, add bias b, apply activation g: h = g(Wx + b). If there are n₀ inputs and n₁ hidden units, W is n₁ × n₀.", from:"h = σ(Wx + b)"},
    {q:"Why can't z = Uh be the classifier's final output?",
     a:"z is a vector of arbitrary real numbers. Classification needs a probability distribution, so softmax exponentiates and normalises z so the entries lie in (0,1) and sum to 1.", from:"The output layer and softmax"},
    {q:"What does multiplying the embedding matrix E by a one-hot vector actually accomplish?",
     a:"It selects the column of E belonging to that word — a lookup. Every other product is zero, so real implementations index directly into E.", from:"One-hot vectors and the embedding lookup"},
    {q:"Write the chain-rule decomposition backprop uses for an output weight w₅.",
     a:"∂E/∂w₅ = (∂E/∂out_o1)(∂out_o1/∂net_o1)(∂net_o1/∂w₅) — error to output, output to net input, net input to weight. The three factors are −(t−out), out(1−out), and out_h1.", from:"Backward pass: updating w₅"}
  ];
  let seen=0;
  $('#l23quiz').innerHTML=Q.map((x,i)=>`
    <div class="panel" style="margin:14px 0">
      <div style="display:flex;gap:12px;align-items:baseline">
        <span class="mono" style="font-size:11px;color:var(--muted)">${String(i+1).padStart(2,'0')}</span>
        <div style="flex:1">
          <p style="margin:0 0 10px;font-size:16px">${x.q}</p>
          <button class="btn ghost" data-i="${i}">Reveal answer</button>
          <div id="a${i}" style="display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--rule-soft)">
            <p style="margin:0;font-size:15px;color:var(--ink-2)">${x.a}</p>
            <div class="lbl" style="font-family:var(--sans);font-size:10.5px;color:var(--muted);margin-top:8px">Lesson: ${x.from}</div>
          </div>
        </div></div></div>`).join('');
  const score=()=>{ $('#l23score').innerHTML=`
    <div class="lbl" style="font-family:var(--sans);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)">revealed</div>
    <div class="mono" style="font-size:30px;font-weight:700">${seen} / ${Q.length}</div>
    <p style="font-family:var(--sans);font-size:13px;color:var(--muted);margin:6px 0 0">
    ${seen===Q.length?"That's the whole lecture. Go back to any lesson from the sidebar to replay a simulation.":"Work through them all — the ones you have to reveal are your revision list."}</p>`;};
  $$('#l23quiz button').forEach(b=>b.onclick=()=>{
    const el=$('#a'+b.dataset.i);
    if(el.style.display==='none'){el.style.display='block';b.textContent='Hide answer';b.classList.add('fade');seen++;score();}
    else{el.style.display='none';b.textContent='Reveal answer';seen--;score();}
  });
  score();
}});

/* ============================================================
   Router
   ============================================================ */
let cur=0;
const visited=new Set([0]);

function buildNav(){
  let html='',lastUnit=null;
  LESSONS.forEach((l,i)=>{
    if(l.unit!==lastUnit){ html+=`<div class="unit-label">${l.unit}</div>`; lastUnit=l.unit; }
    html+=`<a data-i="${i}" tabindex="0"><span class="n">${String(i+1).padStart(2,'0')}</span><span>${l.title}</span></a>`;
  });
  $('#nav').innerHTML=html;
  $$('#nav a').forEach(a=>{
    a.onclick=()=>go(+a.dataset.i);
    a.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();go(+a.dataset.i);} };
  });
}
function refreshNav(){
  $$('#nav a').forEach(a=>{
    const i=+a.dataset.i;
    a.classList.toggle('active',i===cur);
    a.classList.toggle('done',visited.has(i)&&i!==cur);
  });
  const pct=visited.size/LESSONS.length*100;
  $('#pbar').style.width=pct+'%';
  $('#pnum').textContent=`${visited.size} / ${LESSONS.length} lessons opened`;
}
function go(i){
  cur=clamp(i,0,LESSONS.length-1);
  visited.add(cur);
  const l=LESSONS[cur];
  $('#stage').innerHTML=`<div class="fade">
    <div class="eyebrow"><span class="tag">${String(cur+1).padStart(2,'0')}</span><span>${l.unit}</span><span style="color:var(--rule)">/</span><span>${l.slides}</span></div>
    <h2 class="title">${l.title}</h2>
    <p class="sub">${l.sub}</p>
    ${l.html}</div>`;
  try{ l.init&&l.init(); }catch(e){ console.error('lesson init failed',cur,e); }
  $('#fnum').textContent=`${cur+1} / ${LESSONS.length}`;
  $('#ftitle').textContent=l.title;
  $('#prev').disabled=cur===0;
  $('#next').textContent = cur===LESSONS.length-1 ? 'Start over ↺' : 'Next →';
  refreshNav();
  window.scrollTo({top:0,behavior:'instant'});
  closeSide();
  if(location.hash!=='#'+(cur+1)) history.replaceState(null,'','#'+(cur+1));
}
$('#next').onclick=()=>go(cur===LESSONS.length-1?0:cur+1);
$('#prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea')) return;
  if(e.key==='ArrowRight') go(cur+1);
  if(e.key==='ArrowLeft')  go(cur-1);
});
/* mobile drawer */
function openSide(){ $('#side').classList.add('open'); $('#scrim').classList.add('on'); }
function closeSide(){ $('#side').classList.remove('open'); $('#scrim').classList.remove('on'); }
$('#menubtn').onclick=openSide;
$('#scrim').onclick=closeSide;

buildNav();
const start=parseInt((location.hash||'').replace('#',''),10);
go(Number.isFinite(start)&&start>=1?start-1:0);
</script>
